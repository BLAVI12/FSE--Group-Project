# Runs on every pull request to main and on every push to main. A pull
# request should only be merged when both jobs are green: the web job builds
# the same Next.js app Vercel deploys, so a broken production build shows up
# here before the merge instead of on the live site.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch cancels the older, now pointless run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tests, type check, seed check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # package.json requires Node 24 (TypeScript tests run natively)
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run check:category-seed

  web:
    name: Web app (test, lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: 1
      # The build only needs these to exist; it does not contact Supabase.
      # Placeholders keep CI independent of any real project.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
